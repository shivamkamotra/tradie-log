<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Work Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f2f5f6;--card:#fff;--ink:#13222b;--mute:#5d7078;--line:#d5dee2;--acc:#0f766e;--accink:#fff;--warn:#b45309;--ok:#15803d;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0e171c;--card:#16232a;--ink:#e6eef1;--mute:#8fa4ad;--line:#2a3b44;--acc:#2dd4bf;--accink:#062a27;--warn:#f59e0b;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 "Schibsted Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
nav{display:flex;gap:8px;margin-bottom:16px}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-weight:500}
nav button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;padding:12px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slip{margin:20px 0 12px;padding:16px;border:1px dashed var(--mute);border-radius:8px;background:var(--card)}
.slip div{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.slip .amt{font-size:34px;font-weight:700;color:var(--acc)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:6px 0}
.btn{width:100%;padding:14px;border:0;border-radius:8px;background:var(--acc);color:var(--accink);font:inherit;font-weight:700}
.btn:disabled{opacity:.45}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500;margin-top:8px}
.msg{margin-top:10px;color:var(--ok);font-size:14px;min-height:20px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tot div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;font-variant-numeric:tabular-nums}
.tot small{display:block;color:var(--mute);font-size:12px}
.tot b{font-size:17px}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.item .top{display:flex;justify-content:space-between;gap:8px}
.item .sub{color:var(--mute);font-size:14px;margin:2px 0 8px}
.item .bot{display:flex;gap:8px;align-items:center}
.item select{padding:8px}
.item .del{width:auto;padding:8px 12px;border:1px solid var(--line);background:none;color:var(--bad);border-radius:8px;font:inherit}
.s-Paid{color:var(--ok)}.s-Pending,.s-Invoiced{color:var(--warn)}
.empty{color:var(--mute);text-align:center;padding:30px 0}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Work Log</h1>
<nav><button class="on" data-tab="log">Log shift</button><button data-tab="hist">History</button></nav>

<section id="log">
  <label for="provider">Provider</label>
  <input id="provider" list="plist" autocomplete="off" placeholder="e.g. Acme Care">
  <datalist id="plist"></datalist>
  <div class="row">
    <div><label for="start">Start time</label><input id="start" type="time"></div>
    <div><label for="end">End time</label><input id="end" type="time"></div>
  </div>
  <div class="row">
    <div><label for="rate">Hourly rate ($)</label><input id="rate" type="number" inputmode="decimal" min="0" step="0.01"></div>
    <div><label for="brk">Unpaid break (min)</label><input id="brk" type="number" inputmode="numeric" min="0" step="1" value="0"></div>
  </div>
  <label for="date">Date</label>
  <input id="date" type="date">
  <div class="slip">
    <div><span>Total payable hours</span><b id="hrs">–</b></div>
    <div><span>Payable amount</span><span class="amt" id="amt">–</span></div>
  </div>
  <div class="err" id="err"></div>
  <button class="btn" id="save" disabled>Save shift</button>
  <div class="msg" id="msg"></div>
</section>

<section id="hist" class="hide">
  <label for="filter">Provider</label>
  <select id="filter"></select>
  <div class="tot">
    <div><small>Hours</small><b id="tH">0</b></div>
    <div><small>Earned</small><b id="tE">$0</b></div>
    <div><small>Not paid yet</small><b id="tU">$0</b></div>
  </div>
  <div id="list"></div>
  <button class="btn" id="xOne">Download this provider's Excel</button>
  <button class="btn alt" id="xAll">Download all providers (one tab each)</button>
  <button class="btn alt" id="bak">Back up data (.json)</button>
  <button class="btn alt" id="rst">Restore from backup</button>
  <input type="file" id="file" accept=".json,application/json" class="hide">
</section>
</main>

<script>
const KEY = "worklog.v1";
let shifts = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + n.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const clock = t => { const [h, m] = t.split(":").map(Number); return ((h % 12) || 12) + ":" + String(m).padStart(2, "0") + (h < 12 ? " am" : " pm"); };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const ddmmyyyy = s => s.split("-").reverse().join("/");
const serial = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 86400000 + 25569; };

function load() { try { shifts = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { shifts = []; } }
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(shifts)); return true; }
  catch (e) { alert("Could not save: browser storage is blocked or full."); return false; }
}
function calc(start, end, rate, brk) {
  const dur = ((mins(end) - mins(start)) % 1440 + 1440) % 1440;   // handles shifts past midnight
  const hrs = Math.round((dur - brk) / 60 * 100) / 100;
  return { dur, hrs, amt: Math.round(hrs * rate * 100) / 100 };
}
const providers = () => [...new Set(shifts.map(s => s.provider))].sort((a, b) => a.localeCompare(b));

/* ---------- Log form ---------- */
function preview() {
  const p = $("provider").value.trim(), s = $("start").value, e = $("end").value;
  const rate = parseFloat($("rate").value), brk = parseInt($("brk").value || "0", 10);
  let err = "", ok = false;
  $("hrs").textContent = $("amt").textContent = "–";
  if (p && s && e && !isNaN(rate) && !isNaN(brk)) {
    const c = calc(s, e, rate, brk);
    if (rate < 0 || brk < 0) err = "Rate and break can't be negative.";
    else if (brk >= c.dur) err = "The unpaid break is as long as the whole shift.";
    else { $("hrs").textContent = c.hrs; $("amt").textContent = money(c.amt); ok = true; }
  }
  $("err").textContent = err;
  $("save").disabled = !ok;
}
$("provider").addEventListener("change", () => {
  const last = shifts.filter(s => s.provider.toLowerCase() === $("provider").value.trim().toLowerCase()).pop();
  if (last && !$("rate").value) $("rate").value = last.rate;
  preview();
});
["provider", "start", "end", "rate", "brk"].forEach(id => $(id).addEventListener("input", preview));
$("save").addEventListener("click", () => {
  const known = providers().find(p => p.toLowerCase() === $("provider").value.trim().toLowerCase());
  shifts.push({
    id: Date.now() + "" + Math.floor(Math.random() * 1000),
    date: $("date").value || today(),
    provider: known || $("provider").value.trim(),
    start: $("start").value, end: $("end").value,
    rate: parseFloat($("rate").value), brk: parseInt($("brk").value || "0", 10), status: ""
  });
  if (!persist()) { shifts.pop(); return; }
  const l = shifts[shifts.length - 1], c = calc(l.start, l.end, l.rate, l.brk);
  $("msg").textContent = "Saved: " + c.hrs + " hrs, " + money(c.amt) + ".";
  ["provider", "start", "end", "rate"].forEach(id => $(id).value = "");
  $("brk").value = 0; $("date").value = today();
  refreshProviders(); preview();
});

/* ---------- History ---------- */
function refreshProviders() {
  const ps = providers(), cur = $("filter").value;
  $("plist").innerHTML = ps.map(p => `<option value="${esc(p)}">`).join("");
  $("filter").innerHTML = '<option value="">All providers</option>' + ps.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
  if (ps.includes(cur)) $("filter").value = cur;
}
const filtered = () => shifts.filter(s => !$("filter").value || s.provider === $("filter").value)
  .sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
function renderHistory() {
  const list = filtered();
  let h = 0, e = 0, paid = 0;
  list.forEach(s => { const c = calc(s.start, s.end, s.rate, s.brk); h += c.hrs; e += c.amt; if (s.status === "Paid") paid += c.amt; });
  $("tH").textContent = Math.round(h * 100) / 100;
  $("tE").textContent = money(e);
  $("tU").textContent = money(e - paid);
  $("list").innerHTML = list.length ? list.map(s => {
    const c = calc(s.start, s.end, s.rate, s.brk);
    return `<div class="item" data-id="${s.id}">
      <div class="top"><b>${esc(s.provider)}</b><b>${money(c.amt)}</b></div>
      <div class="sub">${ddmmyyyy(s.date)}, ${clock(s.start)} to ${clock(s.end)}, ${c.hrs} hrs at ${money(s.rate)}/hr, ${s.brk} min break</div>
      <div class="bot">
        <select aria-label="Status" class="s-${s.status}">${["", "Pending", "Invoiced", "Paid"].map(o => `<option value="${o}"${o === s.status ? " selected" : ""}>${o || "Status: not set"}</option>`).join("")}</select>
        <button class="del">Delete</button>
      </div></div>`;
  }).join("") : '<div class="empty">No shifts yet. Log your first one on the Log shift tab.</div>';
}
$("filter").addEventListener("change", renderHistory);
$("list").addEventListener("change", ev => {
  const s = shifts.find(x => x.id === ev.target.closest(".item").dataset.id);
  if (s) { s.status = ev.target.value; persist(); renderHistory(); }
});
$("list").addEventListener("click", ev => {
  if (!ev.target.classList.contains("del")) return;
  if (!confirm("Delete this shift?")) return;
  shifts = shifts.filter(x => x.id !== ev.target.closest(".item").dataset.id);
  persist(); refreshProviders(); renderHistory();
});

/* ---------- Excel export ---------- */
function sheetFor(list) {
  const ws = {}, put = (r, c, o) => ws[XLSX.utils.encode_cell({ r, c })] = o;
  ["Date", "Provider", "Start Time", "End Time", "Hourly Rate ($)", "Unpaid Break (min)", "Total Payable Hrs", "Payable Amount ($)", "Status"]
    .forEach((h, i) => put(0, i, { t: "s", v: h }));
  let th = 0, te = 0, tp = 0;
  list.forEach((x, i) => {
    const r = i + 1, R = r + 1, c = calc(x.start, x.end, x.rate, x.brk);
    th += c.hrs; te += c.amt; if (x.status === "Paid") tp += c.amt;
    put(r, 0, { t: "n", v: serial(x.date), z: "dd/mm/yyyy" });
    put(r, 1, { t: "s", v: x.provider });
    put(r, 2, { t: "n", v: mins(x.start) / 1440, z: "h:mm AM/PM" });
    put(r, 3, { t: "n", v: mins(x.end) / 1440, z: "h:mm AM/PM" });
    put(r, 4, { t: "n", v: x.rate, z: "$#,##0.00" });
    put(r, 5, { t: "n", v: x.brk });
    put(r, 6, { t: "n", v: c.hrs, f: `ROUND(MOD(D${R}-C${R},1)*24-F${R}/60,2)`, z: "0.00" });
    put(r, 7, { t: "n", v: c.amt, f: `ROUND(E${R}*G${R},2)`, z: "$#,##0.00" });
    put(r, 8, { t: "s", v: x.status || "" });
  });
  put(0, 10, { t: "s", v: "Total hours" });       put(0, 11, { t: "n", v: th, f: "SUM(G2:G2000)", z: "0.00" });
  put(1, 10, { t: "s", v: "Total earned ($)" });  put(1, 11, { t: "n", v: te, f: "SUM(H2:H2000)", z: "$#,##0.00" });
  put(2, 10, { t: "s", v: "Not yet paid ($)" });  put(2, 11, { t: "n", v: te - tp, f: 'SUM(H2:H2000)-SUMIF(I2:I2000,"Paid",H2:H2000)', z: "$#,##0.00" });
  put(3, 10, { t: "s", v: "Paid ($)" });         put(3, 11, { t: "n", v: tp, f: 'SUMIF(I2:I2000,"Paid",H2:H2000)', z: "$#,##0.00" });
  ws["!ref"] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(list.length, 3), c: 11 } });
  ws["!cols"] = [12, 22, 12, 12, 14, 18, 16, 18, 12, 3, 18, 14].map(w => ({ wch: w }));
  return ws;
}
const byDate = list => list.slice().sort((a, b) => (a.date + a.id).localeCompare(b.date + b.id));
const fname = p => p.replace(/[^A-Za-z0-9 _-]/g, "").trim().replace(/\s+/g, "_").toLowerCase() || "provider";
function exportFile(wb, name) { try { XLSX.writeFile(wb, name); } catch (e) { alert("Excel export failed. Check your internet connection (the Excel library loads online) and try again."); } }
$("xOne").addEventListener("click", () => {
  const p = $("filter").value;
  if (!p) return alert("Pick a provider in the list above first.");
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheetFor(byDate(shifts.filter(s => s.provider === p))), "Shifts");
  exportFile(wb, fname(p) + ".xlsx");
});
$("xAll").addEventListener("click", () => {
  if (!shifts.length) return alert("Nothing to export yet.");
  const wb = XLSX.utils.book_new(), used = new Set();
  providers().forEach(p => {
    let n = p.replace(/[\\\/?*\[\]:]/g, "").slice(0, 28) || "Provider", k = 1, base = n;
    while (used.has(n.toLowerCase())) n = base + " " + (++k);
    used.add(n.toLowerCase());
    XLSX.utils.book_append_sheet(wb, sheetFor(byDate(shifts.filter(s => s.provider === p))), n);
  });
  exportFile(wb, "work_log_all.xlsx");
});

/* ---------- Backup / restore ---------- */
$("bak").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(shifts)], { type: "application/json" }));
  a.download = "work_log_backup_" + today() + ".json";
  a.click();
});
$("rst").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", ev => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data)) throw 0;
      const have = new Set(shifts.map(s => s.id));
      const add = data.filter(s => s && s.id && s.provider && s.start && s.end && !have.has(s.id));
      shifts = shifts.concat(add); persist(); refreshProviders(); renderHistory();
      alert("Restored " + add.length + " shifts.");
    } catch (e) { alert("That file isn't a Work Log backup."); }
    ev.target.value = "";
  };
  r.readAsText(f);
});

/* ---------- Tabs & start-up ---------- */
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  $("log").classList.toggle("hide", b.dataset.tab !== "log");
  $("hist").classList.toggle("hide", b.dataset.tab !== "hist");
  if (b.dataset.tab === "hist") renderHistory();
}));
load(); $("date").value = today(); refreshProviders(); preview();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
