<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Work Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Work Log</h1>
<nav><button class="on" data-tab="log">Log shift</button><button data-tab="hist">History</button><button data-tab="bund">Bundles</button></nav>

<section id="log">
  <label for="provider">Provider</label>
  <input id="provider" list="plist" autocomplete="off" placeholder="e.g. Acme Care">
  <datalist id="plist"></datalist>
  <div class="row">
    <div><label for="start">Start time</label><input id="start" type="time"></div>
    <div><label for="end">End time</label><input id="end" type="time"></div>
  </div>
  <label>Pay type</label>
  <div class="seg" id="ptype"><button type="button" class="on" data-v="hourly">Hourly rate</button><button type="button" data-v="fixed">Fixed rate</button></div>
  <div class="row">
    <div><label for="rate" id="rateLbl">Hourly rate ($)</label><input id="rate" type="number" inputmode="decimal" min="0" step="0.01"></div>
    <div><label for="brk">Unpaid break (min)</label><input id="brk" type="number" inputmode="numeric" min="0" step="1" value="0"></div>
  </div>
  <label for="date">Date</label>
  <input id="date" type="date">
  <div class="slip">
    <div><span>Total payable hours</span><b id="hrs">–</b></div>
    <div><span>Payable amount</span><span class="amt" id="amt">–</span></div>
  </div>
  <div class="err" id="err"></div>
  <button class="btn" id="save">Save shift</button>
  <div class="msg" id="msg"></div>
</section>

<section id="bund" class="hide">
  <label>Bundle by</label>
  <div class="seg" id="bper"><button type="button" data-v="weekly">Weekly</button><button type="button" data-v="fortnightly">Fortnightly</button><button type="button" data-v="monthly">Monthly</button></div>
  <div id="anchorBox"><label for="anchor">Pay period starts on (picks the day each week begins, and which fortnight comes first)</label><input id="anchor" type="date"></div>
  <label for="bfilter">Provider</label>
  <select id="bfilter"></select>
  <div id="blist" style="margin-top:14px"></div>
  <button class="btn alt" id="xBund">Download bundles as Excel</button>
</section>

<section id="hist" class="hide">
  <label for="filter">Provider</label>
  <select id="filter"></select>
  <div class="tot">
    <div><small>Hours</small><b id="tH">0</b></div>
    <div><small>Earned</small><b id="tE">$0</b></div>
    <div><small>Not paid yet</small><b id="tU">$0</b></div>
  </div>
  <div id="list"></div>
  <button class="btn" id="xOne">Download this provider's Excel</button>
  <button class="btn alt" id="xAll">Download all providers (one tab each)</button>
  <button class="btn alt" id="bak">Back up data (.json)</button>
  <button class="btn alt" id="rst">Restore from backup</button>
  <input type="file" id="file" accept=".json,application/json" class="hide">
</section>
</main>

<script src="app.js"></script>
</body>
</html>
